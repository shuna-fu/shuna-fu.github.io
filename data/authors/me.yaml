bio: |
  Hello!

  I am a PhD student in Developmental Psychology and Education at the University of Toronto.

  My research focuses on understanding how wisdom, cognition, and psychological well-being develop across the lifespan. I investigate how wisdom can be cultivated in everyday life and examine the cultural and developmental pathways that shape wise reasoning and human behavior. I am also interested in exploring how human-centered AI can support wiser decision-making and improve psychological well-being, mental health, and educational outcomes.
  
  I welcome opportunities for interdisciplinary research collaboration.


